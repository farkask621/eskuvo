<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kíra & Zoli — Esküvői Magazin 2027</title>
    <meta name="description" content="Kíra és Zoli esküvője — 2027. június 5.">
    <meta name="theme-color" content="#faf8f5">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
            scroll-behavior: smooth;
        }

        body {
            background: #faf8f5;
            font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
            color: #2a2a2a;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Magazine pages */
        .magazine {
            max-width: 600px;
            margin: 0 auto;
        }

        .magazine-page {
            width: 100%;
            display: block;
            height: auto;
        }

        /* Countdown section */
        .countdown-section {
            max-width: 600px;
            margin: 0 auto;
            padding: 50px 24px 80px;
            text-align: center;
            background: #faf8f5;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .countdown-section.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .countdown-divider {
            width: 60px;
            height: 1px;
            background: #c9b99a;
            margin: 0 auto 36px;
        }

        .countdown-title {
            font-size: 1.15rem;
            font-style: italic;
            font-weight: 400;
            color: #555;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .countdown-date {
            font-size: 0.85rem;
            font-weight: 600;
            color: #999;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 44px;
        }

        .countdown-grid {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 6px;
        }

        .countdown-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 90px;
        }

        .countdown-number-wrapper {
            position: relative;
            width: 100%;
            height: 68px;
            overflow: hidden;
        }

        .countdown-number {
            font-family: 'DM Serif Display', Georgia, serif;
            font-size: 3.4rem;
            font-weight: 400;
            line-height: 68px;
            color: #2a2a2a;
            text-align: center;
            width: 100%;
            display: block;
            font-variant-numeric: tabular-nums;
            font-feature-settings: "tnum";
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                        opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .countdown-number.tick-out {
            transform: translateY(-100%);
            opacity: 0;
        }

        .countdown-number.tick-in {
            transform: translateY(100%);
            opacity: 0;
        }

        .countdown-label {
            font-size: 0.65rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            color: #999;
            margin-top: 8px;
        }

        .countdown-colon {
            font-family: 'DM Serif Display', Georgia, serif;
            font-size: 2rem;
            font-weight: 400;
            color: #ccc;
            line-height: 68px;
            padding: 0 2px;
            user-select: none;
        }

        /* After wedding */
        .countdown-ended {
            font-size: 1.3rem;
            font-style: italic;
            color: #2a2a2a;
            line-height: 1.8;
        }

        .countdown-hearts {
            font-size: 1.5rem;
            margin-top: 16px;
            opacity: 0.6;
        }

        /* Footer */
        .footer {
            max-width: 600px;
            margin: 0 auto;
            padding: 0 24px 40px;
            text-align: center;
        }

        .footer-line {
            width: 40px;
            height: 1px;
            background: #ddd;
            margin: 0 auto 16px;
        }

        .footer-text {
            font-size: 0.7rem;
            color: #bbb;
            letter-spacing: 1px;
        }

        /* Responsive */
        @media (max-width: 380px) {
            .countdown-item {
                width: 70px;
            }
            .countdown-number {
                font-size: 2.6rem;
            }
            .countdown-number-wrapper {
                height: 54px;
            }
            .countdown-number {
                line-height: 54px;
            }
            .countdown-colon {
                line-height: 54px;
                font-size: 1.6rem;
            }
            .countdown-grid {
                gap: 2px;
            }
        }

        @media (min-width: 601px) {
            .countdown-item {
                width: 110px;
            }
            .countdown-number {
                font-size: 4rem;
            }
            .countdown-number-wrapper {
                height: 80px;
            }
            .countdown-number {
                line-height: 80px;
            }
            .countdown-colon {
                line-height: 80px;
                font-size: 2.4rem;
            }
        }
    </style>
</head>
<body>

    <!-- Magazine pages -->
    <div class="magazine">
        <img class="magazine-page" src="images/page-1.png" alt="Borító" loading="eager">
        <img class="magazine-page" src="images/page-2.png" alt="1. oldal" loading="lazy">
        <img class="magazine-page" src="images/page-3.png" alt="2. oldal — Köszöntő" loading="lazy">
        <img class="magazine-page" src="images/page-4.png" alt="3. oldal — A mi történetünk" loading="lazy">
        <img class="magazine-page" src="images/page-5.png" alt="4. oldal — A nap menetrendje" loading="lazy">
        <img class="magazine-page" src="images/page-6.png" alt="5. oldal — Esküvői csapat" loading="lazy">
        <img class="magazine-page" src="images/page-7.png" alt="6. oldal — Dresscode" loading="lazy">
        <img class="magazine-page" src="images/page-8.png" alt="7. oldal — Gyakori kérdések" loading="lazy">
        <img class="magazine-page" src="images/page-9.png" alt="8. oldal — Ott találkozunk!" loading="lazy">
    </div>

    <!-- Countdown -->
    <section class="countdown-section" id="countdown">
        <div class="countdown-divider"></div>
        <p class="countdown-title">Visszaszámlálás a nagy napig</p>
        <p class="countdown-date">2027. június 5. · szombat · 17:00</p>

        <div class="countdown-grid" id="countdown-grid">
            <div class="countdown-item">
                <div class="countdown-number-wrapper">
                    <span class="countdown-number" id="days">000</span>
                </div>
                <span class="countdown-label">nap</span>
            </div>
            <span class="countdown-colon">:</span>
            <div class="countdown-item">
                <div class="countdown-number-wrapper">
                    <span class="countdown-number" id="hours">00</span>
                </div>
                <span class="countdown-label">óra</span>
            </div>
            <span class="countdown-colon">:</span>
            <div class="countdown-item">
                <div class="countdown-number-wrapper">
                    <span class="countdown-number" id="minutes">00</span>
                </div>
                <span class="countdown-label">perc</span>
            </div>
            <span class="countdown-colon">:</span>
            <div class="countdown-item">
                <div class="countdown-number-wrapper">
                    <span class="countdown-number" id="seconds">00</span>
                </div>
                <span class="countdown-label">mp</span>
            </div>
        </div>
    </section>

    <div class="footer">
        <div class="footer-line"></div>
        <p class="footer-text">K & Z · 2027</p>
    </div>

    <script>
        // ============================================================
        // Wedding countdown — June 5, 2027, 17:00 Budapest (CEST, UTC+2)
        //
        // Using a fixed UTC timestamp to avoid any timezone/DST issues.
        // 17:00 CEST (UTC+2) = 15:00 UTC
        //
        // Date.UTC month is 0-indexed: 5 = June
        // ============================================================
        var WEDDING_UTC = Date.UTC(2027, 5, 5, 15, 0, 0);
        //                             ^  ^  ^  ^^
        //                          year  |  |  hour (UTC)
        //                             month |
        //                          (0-idx)  day

        var prevValues = { days: null, hours: null, minutes: null, seconds: null };

        function padTwo(n) {
            return n < 10 ? '0' + n : String(n);
        }

        function animateChange(el, newText) {
            // Tick-out current value
            el.classList.add('tick-out');

            setTimeout(function () {
                el.textContent = newText;
                el.classList.remove('tick-out');
                el.classList.add('tick-in');

                // Force reflow so the tick-in class applies from the offset position
                void el.offsetWidth;

                el.classList.remove('tick-in');
            }, 200);
        }

        function updateCountdown() {
            var now = Date.now();
            var diff = WEDDING_UTC - now;

            if (diff <= 0) {
                // Wedding has started!
                var grid = document.getElementById('countdown-grid');
                grid.innerHTML =
                    '<div>' +
                    '<p class="countdown-ended">Az esküvő megkezdődött!</p>' +
                    '<p class="countdown-ended">Sok boldogságot Kírának és Zolinak!</p>' +
                    '</div>';
                return; // stop updating
            }

            var totalSeconds = Math.floor(diff / 1000);
            var days = Math.floor(totalSeconds / 86400);
            var hours = Math.floor((totalSeconds % 86400) / 3600);
            var minutes = Math.floor((totalSeconds % 3600) / 60);
            var seconds = totalSeconds % 60;

            var daysStr = String(days);
            var hoursStr = padTwo(hours);
            var minutesStr = padTwo(minutes);
            var secondsStr = padTwo(seconds);

            var daysEl = document.getElementById('days');
            var hoursEl = document.getElementById('hours');
            var minutesEl = document.getElementById('minutes');
            var secondsEl = document.getElementById('seconds');

            if (prevValues.days !== daysStr) {
                animateChange(daysEl, daysStr);
                prevValues.days = daysStr;
            }
            if (prevValues.hours !== hoursStr) {
                animateChange(hoursEl, hoursStr);
                prevValues.hours = hoursStr;
            }
            if (prevValues.minutes !== minutesStr) {
                animateChange(minutesEl, minutesStr);
                prevValues.minutes = minutesStr;
            }
            if (prevValues.seconds !== secondsStr) {
                animateChange(secondsEl, secondsStr);
                prevValues.seconds = secondsStr;
            }

            setTimeout(updateCountdown, 1000);
        }

        // Fade-in when countdown scrolls into view
        function observeCountdown() {
            var section = document.getElementById('countdown');
            if ('IntersectionObserver' in window) {
                var observer = new IntersectionObserver(function (entries) {
                    entries.forEach(function (entry) {
                        if (entry.isIntersecting) {
                            section.classList.add('visible');
                            observer.unobserve(section);
                        }
                    });
                }, { threshold: 0.2 });
                observer.observe(section);
            } else {
                // Fallback for old browsers
                section.classList.add('visible');
            }
        }

        // Start
        updateCountdown();
        observeCountdown();
    </script>

</body>
</html>
